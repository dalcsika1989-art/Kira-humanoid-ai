name: Build KIRA

on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build web application and server bundle
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: kira-web-build
          path: |
            dist/client/
            dist/server/
          if-no-files-found: error
          retention-days: 14
